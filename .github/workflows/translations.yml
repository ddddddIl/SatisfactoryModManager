name: Update translations

on:
  push:
    branches:
      - master

jobs:
  update-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          backend: false

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Update translation keys
        working-directory: frontend
        run: |
          npm run translations:compare -- -ak ${{ secrets.TOLGEE_KEY }}
          npm run translations:sync -- -ak ${{ secrets.TOLGEE_KEY }}
