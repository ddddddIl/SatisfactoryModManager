name: Update translations

on:
  push:
    branches:
      - master

jobs:
  update-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          backend: false

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Update translation keys
        working-directory: frontend
        env:
          TOLGEE_KEY: ${{ secrets.TOLGEE_KEY }}
        # Forks do not have the Tolgee key, and have no translations to sync
        if: ${{ env.TOLGEE_KEY != '' }}
        run: |
          npm run translations:compare -- -ak "$TOLGEE_KEY"
          npm run translations:sync -- -ak "$TOLGEE_KEY"
